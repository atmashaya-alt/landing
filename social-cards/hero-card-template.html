<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Partridg3 Hero Card</title>
<style>
  :root{
    --deep:#0D2C1A; --mid:#0A2415; --card:#0C3A1C;
    --gold:#C9A96E; --gold-dim:rgba(201,169,110,.12); --gold-border:rgba(201,169,110,.30);
    --w100:#fff; --w70:rgba(255,255,255,.70); --w45:rgba(255,255,255,.45);
    --w20:rgba(255,255,255,.20); --w08:rgba(255,255,255,.08);
    --f-display:Georgia,'Times New Roman',serif;
    --f-body:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1080px;overflow:hidden;background:var(--deep);}
  .card{
    position:relative; width:1080px;height:1080px;
    background:
      radial-gradient(ellipse 900px 700px at 82% -8%, rgba(201,169,110,.16), transparent 60%),
      radial-gradient(ellipse 700px 600px at -10% 108%, rgba(15,72,34,.55), transparent 55%),
      linear-gradient(160deg, var(--deep) 0%, var(--mid) 100%);
    display:flex; flex-direction:column; justify-content:space-between;
    padding:76px 76px 64px; font-family:var(--f-body); color:var(--w100);
  }
  /* subtle border frame */
  .card::before{
    content:''; position:absolute; inset:28px; border:1px solid rgba(201,169,110,.14);
    border-radius:6px; pointer-events:none;
  }

  /* top: wordmark */
  .top{display:flex; align-items:center; justify-content:space-between;}
  .wordmark{display:flex;align-items:center;gap:16px;}
  .mark{width:66px;height:48px;flex-shrink:0;}
  .wordmark-text{font-size:20px;font-weight:700;letter-spacing:.01em;}
  .wordmark-text .accent{color:var(--gold);}
  .eyebrow{
    font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);
    background:var(--gold-dim); border:1px solid var(--gold-border); border-radius:999px;
    padding:9px 20px;
  }

  /* middle: content */
  .content{display:flex;flex-direction:column;gap:26px;max-width:880px;}
  .category{
    font-size:15px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--w45);
  }
  .headline{
    font-family:var(--f-display); font-weight:400; font-size:64px; line-height:1.08;
    color:var(--w100); text-wrap:balance;
  }
  .headline .hl{color:var(--gold);}
  .subhead{
    font-size:24px; line-height:1.5; color:var(--w70); max-width:760px; font-weight:400;
  }
  .stat-row{display:flex; gap:44px; margin-top:6px;}
  .stat{display:flex;flex-direction:column;gap:4px;}
  .stat .num{font-family:var(--f-display); font-size:40px; color:var(--gold);}
  .stat .label{font-size:14px; color:var(--w45); font-weight:600;}

  /* bottom: CTA band */
  .bottom{display:flex; align-items:center; justify-content:space-between; gap:32px;}
  .cta{
    display:flex; align-items:center; gap:14px;
    background:var(--gold); color:var(--deep); font-weight:700; font-size:19px;
    padding:18px 32px; border-radius:12px;
  }
  .cta .arrow{font-size:20px;}
  .footer-line{font-size:15px; color:var(--w45); text-align:right; line-height:1.5;}
  .footer-line .link{color:var(--gold); font-weight:600;}

  /* variant: dark accent icon chip used in stat/feature rows */
  .chip-icon{
    width:64px;height:64px;border-radius:16px;background:var(--gold-dim);
    border:1px solid var(--gold-border); display:flex;align-items:center;justify-content:center;
    font-size:30px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="wordmark">
        <svg class="mark" viewBox="0 0 110 80" role="img" aria-label="Partridg3 mark">
          <path d="M 27,50 C 18,38 7,24 3,16  C 7,18 16,34 27,54 Z" fill="#C9A96E"/>
          <path d="M 27,50 C 18,38 7,24 3,16  C 5,16 10,22 16,32 Z"  fill="white" opacity="0.20"/>
          <path d="M 22,46 C 20,42 19,40 18,37 C 20,43 22,49 24,52 Z" fill="black" opacity="0.22"/>
          <path d="M 27,53 C 14,49 3,45 0,43  C 4,47 14,51 27,62 Z" fill="#C9A96E" opacity="0.82"/>
          <path d="M 27,53 C 14,49 3,45 0,43  C 1,44 5,46 10,48 Z"  fill="white" opacity="0.16"/>
          <path d="M 33,60 C 22,64 12,67 8,70  C 12,68 22,65 33,64 Z" fill="#C9A96E" opacity="0.65"/>
          <path d="M 100,16 L 83,13 C 77,7 68,5 61,8 C 55,11 49,17 43,24 C 37,31 30,40 27,53 C 25,58 31,66 44,70 C 54,74 68,72 78,64 C 86,56 90,42 87,30 C 86,26 84,24 83,24 Z" fill="#047857"/>
          <path d="M 43,50 C 37,56 30,62 27,53 C 25,58 31,66 44,70 C 52,73 62,72 65,69 C 56,66 46,60 43,50 Z" fill="black" opacity="0.28"/>
          <path d="M 83,13 C 77,7 68,5 61,8 C 57,10 53,14 50,19 C 60,13 74,12 84,20 C 87,23 87,29 87,30 C 89,24 87,17 83,13 Z" fill="white" opacity="0.22"/>
          <path d="M 43,42 C 51,38 63,36 72,33 L 73,39 C 62,44 50,46 43,45 Z" fill="#94A3A8" opacity="0.88"/>
          <path d="M 68,34 C 71,33 73,33 73,33 L 73,39 C 71,39 69,39 68,38 Z" fill="white" opacity="0.20"/>
          <path d="M 60,9 C 56,2 59,0 62,1 C 67,4 65,9 63,10 Z" fill="#C9A96E"/>
          <path d="M 60,9 C 58,5 59,2 61,1 C 60,3 59,6 60,9 Z"   fill="white" opacity="0.25"/>
          <path d="M 83,13 L 100,16 L 83,24 Z" fill="#C9A96E"/>
          <path d="M 83,13 L 100,16 L 95,15 Z" fill="white" opacity="0.20"/>
          <path d="M 83,20 L 95,17 L 83,24 Z"  fill="black" opacity="0.18"/>
          <circle cx="73"   cy="18"   r="3.8" fill="white"/>
          <circle cx="73.5" cy="19"   r="2"   fill="#0B1912"/>
          <circle cx="72"   cy="17.2" r="1"   fill="white"/>
          <line x1="46" y1="70" x2="44" y2="77" stroke="#C9A96E" stroke-width="2"   stroke-linecap="round"/>
          <line x1="44" y1="77" x2="38" y2="79" stroke="#C9A96E" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="44" y1="77" x2="44" y2="79" stroke="#C9A96E" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="44" y1="77" x2="50" y2="79" stroke="#C9A96E" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="60" y1="70" x2="62" y2="77" stroke="#C9A96E" stroke-width="2"   stroke-linecap="round"/>
          <line x1="62" y1="77" x2="56" y2="79" stroke="#C9A96E" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="62" y1="77" x2="62" y2="79" stroke="#C9A96E" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="62" y1="77" x2="68" y2="79" stroke="#C9A96E" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <div class="wordmark-text">PARTRIDG<span class="accent">3</span></div>
      </div>
      <div class="eyebrow" id="eyebrow">CALCULATOR</div>
    </div>

    <div class="content">
      <div class="category" id="category">Free tool · 2 minutes</div>
      <div class="headline" id="headline">How much <span class="hl">life cover</span> do you actually need?</div>
      <div class="subhead" id="subhead">Our Life Cover calculator works out your real number in under two minutes — income replacement, debt, and education costs included.</div>
      <div class="stat-row" id="statRow">
        <div class="stat"><div class="num">7</div><div class="label">free calculators</div></div>
        <div class="stat"><div class="num">2 min</div><div class="label">to your number</div></div>
      </div>
    </div>

    <div class="bottom">
      <div class="cta"><span id="ctaText">Try it free</span><span class="arrow">→</span></div>
      <div class="footer-line" id="footerLine">Link in bio · <span class="link">partridg3.com</span></div>
    </div>
  </div>

<script>
  // Minimal config-driven content swap — edit CARD below (or call setCard from
  // outside via window.setCard) to produce a new card from this one template.
  function setCard(cfg){
    document.getElementById('eyebrow').textContent = cfg.eyebrow;
    document.getElementById('category').textContent = cfg.category;
    document.getElementById('headline').innerHTML = cfg.headline;
    document.getElementById('subhead').textContent = cfg.subhead;
    document.getElementById('ctaText').textContent = cfg.cta;
    document.getElementById('footerLine').innerHTML = cfg.footer;
    const statRow = document.getElementById('statRow');
    if (cfg.stats && cfg.stats.length){
      statRow.style.display = 'flex';
      statRow.innerHTML = cfg.stats.map(s => `<div class="stat"><div class="num">${s.num}</div><div class="label">${s.label}</div></div>`).join('');
    } else {
      statRow.style.display = 'none';
    }
  }
  window.setCard = setCard;

  // Config-driven render: ?cfg=<encoded JSON> — lets a headless-Chrome batch
  // script produce a new card from this one file without writing temp HTML.
  const params = new URLSearchParams(window.location.search);
  if (params.has('cfg')) {
    // params.get() already decodes one level of percent-encoding — do not
    // decodeURIComponent() again here, it double-decodes and breaks on any
    // literal "%" in the content (e.g. "15%").
    try { setCard(JSON.parse(params.get('cfg'))); }
    catch (e) { document.title = 'CONFIG ERROR: ' + e.message; }
  }
</script>
</body>
</html>
