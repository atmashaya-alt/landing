<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Partridg3 OG Image</title>
<style>
  :root{
    --deep:#0D2C1A; --mid:#0A2415;
    --gold:#C9A96E; --gold-dim:rgba(201,169,110,.12); --gold-border:rgba(201,169,110,.30);
    --w100:#fff; --w70:rgba(255,255,255,.72); --w45:rgba(255,255,255,.48);
    --w08:rgba(255,255,255,.08);
    --f-display:Georgia,'Times New Roman',serif;
    --f-body:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1200px;height:630px;overflow:hidden;background:var(--deep);}
  .card{
    position:relative; width:1200px;height:630px;
    background:
      radial-gradient(ellipse 820px 620px at 88% -10%, rgba(201,169,110,.16), transparent 58%),
      radial-gradient(ellipse 640px 560px at -8% 112%, rgba(15,72,34,.55), transparent 55%),
      linear-gradient(160deg, var(--deep) 0%, var(--mid) 100%);
    display:flex; flex-direction:column; justify-content:space-between;
    padding:64px 72px 52px; font-family:var(--f-body); color:var(--w100);
  }
  .card::before{
    content:''; position:absolute; inset:22px; border:1px solid rgba(201,169,110,.14);
    border-radius:6px; pointer-events:none;
  }
  .top{display:flex; align-items:center; justify-content:space-between;}
  .wordmark{display:flex;align-items:center;gap:14px;}
  .mark{width:56px;height:41px;flex-shrink:0;}
  .wordmark-text{font-size:19px;font-weight:800;letter-spacing:-.01em;}
  .wordmark-text .accent{color:var(--gold);}
  .trust-row{display:flex;gap:10px;}
  .trust-pill{
    font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);
    background:var(--gold-dim); border:1px solid var(--gold-border); border-radius:999px;
    padding:7px 14px;white-space:nowrap;
  }
  .content{display:flex;flex-direction:column;gap:18px;max-width:920px;}
  .headline{
    font-family:var(--f-display); font-weight:400; font-size:58px; line-height:1.1;
    color:var(--w100); text-wrap:balance;
  }
  .headline em{font-style:italic;color:var(--gold);}
  .subhead{font-size:21px; line-height:1.55; color:var(--w70); max-width:760px; font-weight:400;}
  .bottom{display:flex; align-items:center; justify-content:space-between; gap:24px;
    border-top:1px solid var(--w08); padding-top:22px;}
  .bottom-line{font-size:15px;color:var(--w45);}
  .bottom-line .link{color:var(--gold);font-weight:700;}
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="wordmark">

          <path d="M 27,50 C 18,38 7,24 3,16  C 5,16 10,22 16,32 Z"  fill="white" opacity="0.20"/>
          <path d="M 22,46 C 20,42 19,40 18,37 C 20,43 22,49 24,52 Z" fill="black" opacity="0.22"/>
          <path d="M 27,53 C 14,49 3,45 0,43  C 4,47 14,51 27,62 Z" fill="#C9A96E" opacity="0.82"/>
          <path d="M 27,53 C 14,49 3,45 0,43  C 1,44 5,46 10,48 Z"  fill="white" opacity="0.16"/>
          <path d="M 33,60 C 22,64 12,67 8,70  C 12,68 22,65 33,64 Z" fill="#C9A96E" opacity="0.65"/>
          <path d="M 100,16 L 83,13 C 77,7 68,5 61,8 C 55,11 49,17 43,24 C 37,31 30,40 27,53 C 25,58 31,66 44,70 C 54,74 68,72 78,64 C 86,56 90,42 87,30 C 86,26 84,24 83,24 Z" fill="#047857"/>
          <path d="M 43,50 C 37,56 30,62 27,53 C 25,58 31,66 44,70 C 52,73 62,72 65,69 C 56,66 46,60 43,50 Z" fill="black" opacity="0.28"/>
          <path d="M 83,13 C 77,7 68,5 61,8 C 57,10 53,14 50,19 C 60,13 74,12 84,20 C 87,23 87,29 87,30 C 89,24 87,17 83,13 Z" fill="white" opacity="0.22"/>
          <path d="M 43,42 C 51,38 63,36 72,33 L 73,39 C 62,44 50,46 43,45 Z" fill="#94A3A8" opacity="0.88"/>
          <path d="M 68,34 C 71,33 73,33 73,33 L 73,39 C 71,39 69,39 68,38 Z" fill="white" opacity="0.20"/>
          <path d="M 60,9 C 56,2 59,0 62,1 C 67,4 65,9 63,10 Z" fill="#C9A96E"/>

          <line x1="62" y1="77" x2="68" y2="79" stroke="#C9A96E" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <div class="wordmark-text">PARTRIDG<span class="accent">3</span></div>
      </div>
      <div class="trust-row">
        <div class="trust-pill">FAIS Compliant</div>
        <div class="trust-pill">100% Independent</div>
      </div>
    </div>

    <div class="content">
      <div class="headline">Independent advice,<br>built for <em>you</em>.</div>
      <div class="subhead">Free calculators, daily insights, and a licensed adviser matched to you — for every South African.</div>
    </div>

    <div class="bottom">
      <div class="bottom-line">Free tools &amp; consults · Every adviser vetted · Your own pace</div>
      <div class="bottom-line"><span class="link">partridg3-landing.vercel.app</span></div>
    </div>
  </div>
</body>
</html>
